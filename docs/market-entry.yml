# awesome-dsh-plugin 条目
# 目标文件：data/plugins/Applepinea__dsh-gemini-widget.yml
# 提交方式：向 awesome-dsh-plugin/awesome-dsh-plugin 提 PR，只加这一个文件
#
# 说明：这个文件本身是给维护者看的「待提交草稿」，
# 真正提 PR 时只把下面 url/name/category/description/icon 这几行写进目标文件。

url: https://github.com/Applepinea/dsh-gemini-widget
name: Applepinea/dsh-gemini-widget
category: ui
description:
  en: 'A catgirl widget in the DSH window whose expression follows the session state (idle, thinking, waiting for your confirmation, turn finished) and shows live context usage, tokens, cache hit rate, per-turn cost and DeepSeek balance; it plays a sound and pops a bubble when the agent needs a confirmation or an answer, adds a compact stats bar under the input box, and offers adjustable size, sounds and docking.'
  zh: 'DSH 界面里的猫娘挂件，表情随会话状态切换（待机、思考、等你确认、回合结束），实时显示上下文占用、Token、缓存命中率、每轮花费与 DeepSeek 余额；需要授权或提问时发声冒泡提醒，输入框下方附紧凑统计栏，尺寸、音效与停靠可调。'
icon: https://raw.githubusercontent.com/Applepinea/dsh-gemini-widget/main/assets/icon.png
